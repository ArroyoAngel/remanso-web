<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remanso Studio</title>
<meta name="description" content="Remanso Studio: apps sencillas para el trabajo de todos los días, hechas en Bolivia.">
<link rel="icon" href="mi-estanque/icono.png">
<style>
  :root { --ink: #0F2233; --muted: #4B5A66; --primary: #16525F; --soft: #DDEFEC; --ground: #F4F3EF; --line: #D8D6CF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--ink); color: #fff; padding: 56px 20px 64px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.5px; }
  header p { margin: 12px 0 0; font-size: 20px; color: #9FDCD2; }
  main { padding: 40px 20px 64px; }
  h2 { font-size: 24px; margin: 0 0 16px; }
  .app { display: flex; gap: 20px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; color: inherit; text-decoration: none; }
  .app:hover { border-color: var(--primary); }
  .app img { width: 88px; height: 88px; border-radius: 22px; flex-shrink: 0; }
  .app h3 { margin: 0; font-size: 22px; }
  .app p { margin: 4px 0 0; color: var(--muted); }
  footer { padding: 24px 20px 40px; color: var(--muted); font-size: 15px; }
  footer a { color: var(--primary); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Remanso Studio</h1>
    <p>Apps sencillas para el trabajo de todos los días, hechas en Bolivia.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <h2>Nuestras apps</h2>
    <a class="app" href="mi-estanque/">
      <img src="mi-estanque/icono.png" alt="">
      <div>
        <h3>Mi Estanque</h3>
        <p>Calculadora piscícola para pacú y tambaquí: biometría, ración diaria y FCA. Funciona sin internet.</p>
      </div>
    </a>
  </div>
</main>
<footer>
  <div class="wrap">© 2026 Remanso Studio · <a href="mailto:arroyoalangel@gmail.com">arroyoalangel@gmail.com</a></div>
</footer>
</body>
</html>
